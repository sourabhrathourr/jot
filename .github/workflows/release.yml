# Push a vX.Y.Z tag to build, sign, notarize and publish Jot (after Hun's release pipeline).
#
# Needs a "Production" environment with:
#   secrets   DEVELOPER_ID_P12_BASE64, DEVELOPER_ID_P12_PASSWORD, NOTARY_KEY_P8_BASE64,
#             SPARKLE_ED_PRIVATE_KEY
#   variables APPLE_TEAM_ID, NOTARY_KEY_ID, NOTARY_ISSUER_ID
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Restrict release actor
        run: |
          if [[ "${{ github.actor }}" != "sourabhrathourr" ]]; then
            echo "Releases are restricted to sourabhrathourr. Current actor: ${{ github.actor }}"
            exit 1
          fi

      - name: Validate release tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a vX.Y.Z tag, got: $GITHUB_REF_NAME"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build-macos:
    needs: authorize
    runs-on: macos-26
    environment: Production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Validate protected release configuration
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          NOTARY_KEY_ID: ${{ vars.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ vars.NOTARY_ISSUER_ID }}
        run: |
          for name in DEVELOPER_ID_P12_BASE64 DEVELOPER_ID_P12_PASSWORD NOTARY_KEY_P8_BASE64 \
                      SPARKLE_ED_PRIVATE_KEY APPLE_TEAM_ID NOTARY_KEY_ID NOTARY_ISSUER_ID; do
            if [[ -z "${!name}" ]]; then
              echo "Missing production environment secret or variable: $name"
              exit 1
            fi
          done

      - name: Select Xcode 26
        run: scripts/select-xcode-26.sh

      - name: Run the tests
        run: swift test

      - name: Install pinned DMG builder
        run: |
          python3 -m venv "$RUNNER_TEMP/dmgbuild"
          "$RUNNER_TEMP/dmgbuild/bin/pip" install --disable-pip-version-check "dmgbuild==1.6.7"
          echo "$RUNNER_TEMP/dmgbuild/bin" >> "$GITHUB_PATH"

      - name: Choose a build number above the published one
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous=0
          url="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '[.assets[] | select(.name == "appcast.xml") | .browser_download_url][0] // ""' 2>/dev/null || true)"
          if [[ -n "$url" ]]; then
            previous="$(curl -fsSL "$url" | sed -n 's/.*<sparkle:version>\([0-9][0-9]*\)<\/sparkle:version>.*/\1/p' | head -1)"
          fi
          echo "JOT_BUILD=$(( ${previous:-0} + 1 ))" >> "$GITHUB_ENV"

      - name: Import Developer ID certificate
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          keychain_path="$RUNNER_TEMP/jot-release.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "$DEVELOPER_ID_P12_BASE64" | base64 -D > "$certificate_path"
          chmod 600 "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -P "$DEVELOPER_ID_P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          rm -f "$certificate_path"
          echo "JOT_RELEASE_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"

      - name: Decode notarization API key
        env:
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
        run: |
          printf '%s' "$NOTARY_KEY_P8_BASE64" | base64 -D > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
          echo "JOT_NOTARY_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build, sign, notarize, staple, and generate the appcast
        env:
          RELEASE_VERSION: ${{ needs.authorize.outputs.version }}
          JOT_DEVELOPER_ID_APPLICATION: "Developer ID Application: Sourabh Rathour (${{ vars.APPLE_TEAM_ID }})"
          JOT_NOTARY_KEY_ID: ${{ vars.NOTARY_KEY_ID }}
          JOT_NOTARY_ISSUER_ID: ${{ vars.NOTARY_ISSUER_ID }}
          JOT_SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: scripts/package-release.sh --version "$RELEASE_VERSION" --build "$JOT_BUILD" --generate-appcast

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-macos
          path: build/release/dist
          if-no-files-found: error
          retention-days: 7

      - name: Clean up release credentials
        if: always()
        run: |
          if [[ -n "${JOT_RELEASE_KEYCHAIN:-}" ]]; then
            security delete-keychain "$JOT_RELEASE_KEYCHAIN" || true
          fi
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/developer-id.p12"

  publish:
    needs: [authorize, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-macos
          path: release-macos

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-macos/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Jot $GITHUB_REF_NAME" \
            --generate-notes
